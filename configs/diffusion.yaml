data:
  csv_file: "./data/examples/manifest_with_latents.csv"
  cache: false
  num_samples: 2048
  num_workers: 4
  streamline_mins: [-100.76338958740234, -115.52432250976562, -99.00054931640625]
  streamline_maxs: [98.510498046875, 85.17140197753906, 100.56957244873047]

training:
  lr: 0.00005
  batch_size: 1
  n_epochs: 100
  timesteps: 1000

paths:
  base_dir: "."

model:
  input_dim: 3
  num_points: 128
  encoder_channels: [32]
  res_blocks: [2]
  encoder_att_levels: [false]
  norm_eps: 1.0e-6
  sab_layers: 0
  sab_heads: 4
  model_dim: 256
  diff_transformer_layers: 6
  diff_num_heads: 8
  dropout: 0.1
  M: 28
  use_flash_attention: false
  model_type: "encoder"
  cond: true
  seed: false

diffusion:
  schedule: "scaled_linear_beta"
  beta_start: 0.0015
  beta_end: 0.0205
  num_inference_steps: 50

wandb:
  enabled: false
  project: "gentract-open-diffusion"
